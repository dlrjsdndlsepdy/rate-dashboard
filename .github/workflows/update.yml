name: update-rates

on:
  schedule:
    # 아침: 미국 전일 자료(FRED)·국내 주가·외국인 수급(전일) — 한국 시간 06:10~10:40, 30분마다
    - cron: "10,40 21-23 * * *"
    - cron: "10,40 0-1 * * *"
    # 오후~저녁: 당일 국고·회사채·CD·CP·환율(ECOS), 여전채·회사채 민평(KOFIA) — 평일 15:10~20:50, 20분마다
    - cron: "10,30,50 6-11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:          # 실행이 겹치지 않게 한 번에 하나만
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect rates (ECOS)
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python collect.py

      - name: Collect US (FRED)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python collect_us.py

      - name: Check for new data
        id: chk
        run: |
          git add -N data
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "새 데이터 없음 → 페이지 갱신 건너뜀"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "새 데이터 있음 → 페이지 갱신"
          fi

      - name: Build dashboard
        if: steps.chk.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python build_dashboard.py

      - name: Build US pages
        if: steps.chk.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python build_us.py

      - name: Commit & push
        if: steps.chk.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date '+%F %H:%M') rates update"
          git pull --rebase --autostash origin main
          git push
